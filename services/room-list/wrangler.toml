# For setting the room list up from a terminal with Cloudflare's wrangler (docs/room-list.md): the Worker, and the D1
# database it keeps the rooms in. Put the database_id `wrangler d1 create studiosim-rooms` gives below.
name = "studiosim-rooms"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "studiosim-rooms"
database_id = "PUT-THE-DATABASE-ID-HERE"
